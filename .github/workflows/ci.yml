name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trudogolik45/ui exec playwright install --with-deps chromium-headless-shell
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:treeshake
